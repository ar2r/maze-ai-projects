<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with overlay -->
  <rect width="400" height="500" fill="rgba(15, 15, 30, 0.95)"/>

  <!-- Results Card -->
  <rect x="50" y="80" width="300" height="340" rx="16" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#ececec">
    🎉 Level Complete!
  </text>

  <!-- Stats -->
  <g transform="translate(0, 0)">
    <!-- Time -->
    <rect x="70" y="170" width="260" height="50" rx="8" fill="#16213e"/>
    <text x="110" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#a0a0a0">
      Time
    </text>
    <text x="290" y="200" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="end" fill="#3282b8">
      1:23
    </text>

    <!-- Wall Hits -->
    <rect x="70" y="235" width="260" height="50" rx="8" fill="#16213e"/>
    <text x="110" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#a0a0a0">
      Wall Hits
    </text>
    <text x="290" y="265" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="end" fill="#3282b8">
      7
    </text>

    <!-- Best Time -->
    <rect x="70" y="300" width="260" height="50" rx="8" fill="#16213e"/>
    <text x="110" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#a0a0a0">
      Best Time
    </text>
    <text x="290" y="330" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="end" fill="#27ae60">
      1:23 ⭐
    </text>
  </g>

  <!-- Buttons -->
  <defs>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3282b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f4c75;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Next Level Button -->
  <rect x="70" y="370" width="260" height="50" rx="12" fill="url(#btnGrad)"/>
  <text x="200" y="402" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#ffffff">
    Next Level ➡️
  </text>

  <!-- Retry Button -->
  <rect x="70" y="435" width="260" height="50" rx="12" fill="#16213e" stroke="#0f4c75" stroke-width="2"/>
  <text x="200" y="467" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#ececec">
    Retry
  </text>
</svg>
