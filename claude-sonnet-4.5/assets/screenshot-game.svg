<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="600" fill="#0f0f1e"/>

  <!-- HUD -->
  <rect x="10" y="10" width="80" height="50" rx="8" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  <text x="50" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#a0a0a0">LEVEL</text>
  <text x="50" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#3282b8">5</text>

  <rect x="100" y="10" width="80" height="50" rx="8" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  <text x="140" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#a0a0a0">TIME</text>
  <text x="140" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#3282b8">1:23</text>

  <rect x="190" y="10" width="80" height="50" rx="8" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  <text x="230" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#a0a0a0">HITS</text>
  <text x="230" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#3282b8">7</text>

  <!-- Pause Button -->
  <circle cx="560" cy="35" r="25" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  <text x="560" y="45" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#ececec">⏸️</text>

  <!-- Maze -->
  <g transform="translate(100, 100)">
    <!-- Maze background -->
    <rect width="400" height="400" fill="#34495e"/>

    <!-- Maze walls (simplified grid) -->
    <g stroke="#2c3e50" stroke-width="3" stroke-linecap="square">
      <!-- Horizontal walls -->
      <line x1="0" y1="0" x2="400" y2="0"/>
      <line x1="0" y1="80" x2="240" y2="80"/>
      <line x1="320" y1="80" x2="400" y2="80"/>
      <line x1="80" y1="160" x2="400" y2="160"/>
      <line x1="0" y1="240" x2="160" y2="240"/>
      <line x1="240" y1="240" x2="400" y2="240"/>
      <line x1="0" y1="320" x2="320" y2="320"/>
      <line x1="0" y1="400" x2="400" y2="400"/>

      <!-- Vertical walls -->
      <line x1="0" y1="0" x2="0" y2="400"/>
      <line x1="80" y1="0" x2="80" y2="240"/>
      <line x1="160" y1="80" x2="160" y2="320"/>
      <line x1="240" y1="0" x2="240" y2="160"/>
      <line x1="240" y1="240" x2="240" y2="400"/>
      <line x1="320" y1="80" x2="320" y2="400"/>
      <line x1="400" y1="0" x2="400" y2="400"/>
    </g>

    <!-- Start marker -->
    <circle cx="40" cy="40" r="15" fill="#27ae60"/>
    <text x="40" y="48" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ffffff">🏁</text>

    <!-- Finish marker with glow -->
    <defs>
      <radialGradient id="finishGlow">
        <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#e67e22;stop-opacity:0.3" />
      </radialGradient>
    </defs>
    <circle cx="360" cy="360" r="25" fill="url(#finishGlow)"/>
    <circle cx="360" cy="360" r="15" fill="#e67e22"/>
    <text x="360" y="368" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ffffff">🎯</text>

    <!-- Player ball with trail -->
    <defs>
      <radialGradient id="playerGlow">
        <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#3498db;stop-opacity:0" />
      </radialGradient>
    </defs>

    <!-- Trail -->
    <path d="M 120 120 Q 150 140, 180 150" stroke="rgba(52, 152, 219, 0.3)" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Player -->
    <circle cx="200" cy="160" r="15" fill="url(#playerGlow)"/>
    <circle cx="200" cy="160" r="8" fill="#3498db"/>
    <circle cx="197" cy="157" r="3" fill="rgba(255, 255, 255, 0.8)"/>
  </g>

  <!-- Virtual Joystick (mobile hint) -->
  <g opacity="0.5">
    <circle cx="80" cy="520" r="40" fill="#1a1a2e" stroke="#16213e" stroke-width="3"/>
    <circle cx="90" cy="510" r="20" fill="#3282b8" stroke="#0f4c75" stroke-width="3"/>
  </g>
</svg>
