<svg width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#0f0f1e"/>

  <!-- Title -->
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3282b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f4c75;stop-opacity:1" />
    </linearGradient>
  </defs>

  <text x="200" y="150" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="url(#titleGrad)">
    🎯 MAZE RUNNER
  </text>

  <text x="200" y="190" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#a0a0a0">
    Escape the ever-growing labyrinth
  </text>

  <!-- Buttons -->
  <defs>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3282b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f4c75;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- New Game Button -->
  <rect x="50" y="250" width="300" height="60" rx="12" fill="url(#btnGrad)"/>
  <text x="200" y="288" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#ffffff">
    NEW GAME
  </text>

  <!-- Continue Button -->
  <rect x="50" y="330" width="300" height="60" rx="12" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  <text x="200" y="368" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#ececec">
    CONTINUE
  </text>

  <!-- Settings Button -->
  <rect x="50" y="410" width="300" height="60" rx="12" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  <text x="200" y="448" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#ececec">
    SETTINGS
  </text>

  <!-- Stats Preview -->
  <rect x="50" y="500" width="300" height="80" rx="12" fill="#1a1a2e"/>

  <text x="125" y="530" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#a0a0a0">
    BEST LEVEL
  </text>
  <text x="125" y="555" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#3282b8">
    15
  </text>

  <text x="275" y="530" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#a0a0a0">
    TOTAL TIME
  </text>
  <text x="275" y="555" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#3282b8">
    12:34
  </text>
</svg>
