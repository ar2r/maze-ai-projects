<svg width="375" height="667" xmlns="http://www.w3.org/2000/svg">
  <!-- Mobile device frame -->
  <rect width="375" height="667" rx="30" fill="#000000"/>
  <rect x="10" y="10" width="355" height="647" rx="20" fill="#0f0f1e"/>

  <!-- Status bar -->
  <rect x="10" y="10" width="355" height="30" fill="#000000" opacity="0.3"/>
  <text x="30" y="30" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">9:41</text>
  <text x="345" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#ffffff">100% 📶</text>

  <!-- HUD (compact mobile) -->
  <rect x="20" y="50" width="70" height="40" rx="6" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  <text x="55" y="63" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#a0a0a0">LEVEL</text>
  <text x="55" y="78" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#3282b8">3</text>

  <rect x="100" y="50" width="70" height="40" rx="6" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  <text x="135" y="63" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#a0a0a0">TIME</text>
  <text x="135" y="78" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#3282b8">0:45</text>

  <rect x="180" y="50" width="70" height="40" rx="6" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  <text x="215" y="63" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#a0a0a0">HITS</text>
  <text x="215" y="78" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#3282b8">3</text>

  <!-- Pause -->
  <circle cx="335" cy="70" r="20" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  <text x="335" y="78" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#ececec">⏸️</text>

  <!-- Maze (mobile optimized) -->
  <g transform="translate(37.5, 120)">
    <rect width="300" height="300" fill="#34495e"/>

    <!-- Simplified maze walls -->
    <g stroke="#2c3e50" stroke-width="2.5" stroke-linecap="square">
      <line x1="0" y1="0" x2="300" y2="0"/>
      <line x1="0" y1="60" x2="180" y2="60"/>
      <line x1="240" y1="60" x2="300" y2="60"/>
      <line x1="60" y1="120" x2="300" y2="120"/>
      <line x1="0" y1="180" x2="120" y2="180"/>
      <line x1="180" y1="180" x2="300" y2="180"/>
      <line x1="0" y1="240" x2="240" y2="240"/>
      <line x1="0" y1="300" x2="300" y2="300"/>

      <line x1="0" y1="0" x2="0" y2="300"/>
      <line x1="60" y1="0" x2="60" y2="180"/>
      <line x1="120" y1="60" x2="120" y2="240"/>
      <line x1="180" y1="0" x2="180" y2="120"/>
      <line x1="180" y1="180" x2="180" y2="300"/>
      <line x1="240" y1="60" x2="240" y2="300"/>
      <line x1="300" y1="0" x2="300" y2="300"/>
    </g>

    <!-- Start -->
    <circle cx="30" cy="30" r="12" fill="#27ae60"/>
    <text x="30" y="36" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">🏁</text>

    <!-- Finish -->
    <defs>
      <radialGradient id="finishGlowMobile">
        <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#e67e22;stop-opacity:0.3" />
      </radialGradient>
    </defs>
    <circle cx="270" cy="270" r="20" fill="url(#finishGlowMobile)"/>
    <circle cx="270" cy="270" r="12" fill="#e67e22"/>
    <text x="270" y="276" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">🎯</text>

    <!-- Player -->
    <circle cx="150" cy="90" r="10" fill="#3498db"/>
    <circle cx="148" cy="88" r="3" fill="rgba(255, 255, 255, 0.8)"/>
  </g>

  <!-- Virtual Joystick -->
  <g transform="translate(60, 520)">
    <circle cx="0" cy="0" r="50" fill="rgba(26, 26, 46, 0.6)" stroke="#16213e" stroke-width="3"/>
    <circle cx="15" cy="-10" r="25" fill="#3282b8" stroke="#0f4c75" stroke-width="3"/>
  </g>

  <!-- Label -->
  <text x="187" y="610" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#a0a0a0">
    Use joystick to move
  </text>
</svg>
