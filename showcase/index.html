<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Единая витрина AI-игр-лабиринтов с запуском всех проектов из одного интерфейса."
    />
    <title>AI Maze Arcade</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>

      <header class="topbar">
        <a class="brand" href="#top" aria-label="Главная страница AI Maze Arcade">
          <span class="brand-mark"></span>
          <span class="brand-copy">
            <strong>AI Maze Arcade</strong>
            <span>Единый каталог игр</span>
          </span>
        </a>
        <div class="topbar-links">
          <a
            class="repo-link"
            href="https://github.com/ar2r/maze-ai-projects"
            target="_blank"
            rel="noreferrer"
            aria-label="Открыть репозиторий GitHub"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 2C6.48 2 2 6.58 2 12.23c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.49 0-.24-.01-1.04-.01-1.89-2.78.62-3.37-1.21-3.37-1.21-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.58 2.35 1.12 2.92.86.09-.67.35-1.12.63-1.37-2.22-.26-4.56-1.14-4.56-5.08 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.7 0 0 .84-.28 2.75 1.05A9.33 9.33 0 0 1 12 6.84a9.3 9.3 0 0 1 2.5.35c1.9-1.33 2.74-1.05 2.74-1.05.55 1.4.2 2.44.1 2.7.65.72 1.03 1.63 1.03 2.75 0 3.95-2.35 4.81-4.58 5.06.36.32.68.95.68 1.92 0 1.39-.01 2.5-.01 2.84 0 .27.18.59.69.49A10.27 10.27 0 0 0 22 12.23C22 6.58 17.52 2 12 2Z"
              />
            </svg>
            <span>GitHub</span>
          </a>
          <a
            class="repo-link"
            href="https://t.me/ArturNeVegan"
            target="_blank"
            rel="noreferrer"
            aria-label="Открыть Telegram ArturNeVegan"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M21.94 4.66a1.5 1.5 0 0 0-1.67-.25L3.14 11.73a1.5 1.5 0 0 0 .14 2.81l4.38 1.48 1.59 5.03a1.5 1.5 0 0 0 2.65.48l2.46-3.17 4.38 3.22a1.5 1.5 0 0 0 2.37-.88L22 6.09a1.5 1.5 0 0 0-.06-1.43ZM9.1 15.23l8.06-6.37-6.17 7.6-.38 2.49-1.51-3.72Zm1.77-.55-4.9-1.66 13.11-5.6-8.21 7.26Z"
              />
            </svg>
            <span>Telegram</span>
          </a>
          <a
            class="repo-link"
            href="https://github.com/ar2r/maze-ai-projects?tab=readme-ov-file#используемый-промпт-для-ai-агентов"
            target="_blank"
            rel="noreferrer"
            aria-label="Открыть промпт для генерации игр"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Zm4 18H6V4h7v5h5v11Z"
              />
            </svg>
            <span>Промпт</span>
          </a>
        </div>
      </header>

      <main id="top">
        <section class="overview" data-reveal>
          <div class="hero-word" aria-hidden="true">ARCADE</div>
          <div class="overview-copy">
            <p class="eyebrow">AI Maze Arcade</p>
            <h1>Выберите игру по программе и модели.</h1>
            <p class="overview-text">Яркая welcome-страница для всех AI-сборок с быстрым переходом к нужной игре.</p>
          </div>
          <div class="overview-art" aria-hidden="true">
            <span class="art-card art-card-back"></span>
            <span class="art-card art-card-front"></span>
            <span class="art-orb art-orb-orange"></span>
            <span class="art-orb art-orb-lime"></span>
            <span class="art-label art-label-main">AI</span>
            <span class="art-pill art-pill-purple"></span>
            <span class="art-pill art-pill-orange"></span>
          </div>
          <aside class="overview-stats" aria-label="Статистика каталога">
            <div class="stat-grid">
              <article class="stat-card">
                <span class="stat-label">Игр</span>
                <strong id="stat-games">0</strong>
              </article>
              <article class="stat-card">
                <span class="stat-label">Программ</span>
                <strong id="stat-programs">0</strong>
              </article>
              <article class="stat-card">
                <span class="stat-label">Моделей</span>
                <strong id="stat-models">0</strong>
              </article>
            </div>
          </aside>
        </section>

        <section class="catalog-stage section" id="games" data-reveal>
          <div class="filters" data-reveal>
            <div class="filter-group" id="program-filters" aria-label="Фильтры по программе"></div>
          </div>

          <div class="table-shell" data-reveal>
            <table class="games-table">
              <thead>
                <tr>
                  <th scope="col">Программа</th>
                  <th scope="col">Модель</th>
                  <th scope="col">Обновлено</th>
                  <th scope="col" class="actions-col">Запуск</th>
                </tr>
              </thead>
              <tbody id="games-table-body" aria-live="polite"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <template id="game-row-template">
      <tr class="game-row">
        <td data-program></td>
        <td data-model></td>
        <td data-updated-at></td>
        <td class="actions-cell">
          <a class="button button-inline" data-cta href="#">Играть</a>
        </td>
      </tr>
    </template>

    <script type="module" src="./main.js"></script>
  </body>
</html>
