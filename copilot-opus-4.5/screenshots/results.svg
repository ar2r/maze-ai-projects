<svg viewBox="0 0 400 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="450" fill="rgba(26,26,46,0.95)"/>
  
  <!-- Title -->
  <text x="200" y="80" text-anchor="middle" fill="#e94560" font-family="sans-serif" font-size="32" font-weight="bold">Level Complete!</text>
  
  <!-- Level -->
  <text x="200" y="130" text-anchor="middle" fill="#e94560" font-family="sans-serif" font-size="20">Level 5</text>
  
  <!-- Stats -->
  <text x="200" y="180" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="16">Time: <tspan fill="white" font-weight="bold">2:34.56</tspan></text>
  <text x="200" y="210" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="16">Wall Hits: <tspan fill="white" font-weight="bold">7</tspan></text>
  <text x="200" y="250" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="18" font-weight="bold">🏆 New Best Time!</text>
  
  <!-- Next Level Button -->
  <rect x="60" y="290" width="280" height="50" rx="8" fill="url(#btnGradient)"/>
  <text x="200" y="322" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">Next Level</text>
  
  <!-- Retry Button -->
  <rect x="60" y="355" width="280" height="50" rx="8" fill="#0f3460"/>
  <text x="200" y="387" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">Retry</text>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="btnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c23b50"/>
    </linearGradient>
  </defs>
</svg>
