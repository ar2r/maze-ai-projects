<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0c1724" offset="0"/>
      <stop stop-color="#112a46" offset="1"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="340" y="120" width="600" height="480" rx="32" fill="rgba(12,23,36,0.8)" stroke="rgba(255,255,255,0.08)"/>
  <text x="640" y="210" text-anchor="middle" font-family="'SF Pro Display', 'Inter', sans-serif" font-size="64" fill="#f5f7fb">Maze Sprint</text>
  <text x="640" y="260" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" fill="#9fb0c9">Случайные лабиринты, адаптированы под ПК/мобайл</text>
  <rect x="420" y="300" width="440" height="64" rx="16" fill="#ffb703"/>
