<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Maze Runner</title>
    <style>
      /* === Reset & Base === */
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f0e17;
        font-family: monospace, 'Courier New', Courier;
        color: #eaeaea;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      /* === Game Canvas === */
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* === UI Overlay === */
      .screen-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(15, 14, 23, 0.92);
        z-index: 10;
        transition: opacity 0.2s;
      }

      .screen-overlay.hidden {
        display: none;
        opacity: 0;
        pointer-events: none;
      }

      .screen-title {
        font-size: clamp(24px, 6vw, 48px);
        color: #e94560;
        text-transform: uppercase;
        letter-spacing: 4px;
        margin-bottom: 8px;
        text-shadow: 2px 2px 0 #16213e, 0 0 10px rgba(233, 69, 96, 0.5);
      }

      .screen-subtitle {
        font-size: clamp(12px, 3vw, 18px);
        color: #4cc9f0;
        margin-bottom: 32px;
        letter-spacing: 2px;
      }

      .btn {
        display: block;
        min-width: 200px;
        padding: 14px 28px;
        margin: 6px 0;
        font-family: monospace, 'Courier New', Courier;
        font-size: clamp(14px, 3.5vw, 20px);
        color: #eaeaea;
        background: #16213e;
        border: 2px solid #e94560;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: background 0.15s, transform 0.1s;
        text-align: center;
      }

      .btn:hover, .btn:focus-visible {
        background: #e94560;
        color: #0f0e17;
        outline: none;
        transform: scale(1.04);
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn:focus-visible {
        box-shadow: 0 0 0 3px #4cc9f0;
      }

      /* === Settings === */
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(280px, 80vw);
        padding: 10px 0;
        font-size: clamp(13px, 3vw, 17px);
        border-bottom: 1px solid #16213e;
      }

      .settings-row label {
        color: #eaeaea;
      }

      .toggle-btn {
        padding: 6px 16px;
        font-family: monospace;
        font-size: 14px;
        color: #eaeaea;
        background: #16213e;
        border: 1px solid #4cc9f0;
        cursor: pointer;
      }

      .toggle-btn.active {
        background: #4cc9f0;
        color: #0f0e17;
      }

      /* === Results === */
      .result-stats {
        margin: 16px 0;
        text-align: center;
      }

      .result-stats div {
        font-size: clamp(14px, 3.5vw, 20px);
        padding: 4px 0;
        color: #4cc9f0;
      }

      .result-stats .value {
        color: #f5d442;
        font-weight: bold;
      }

      /* === HUD (HTML fallback) === */
      #hud {
        position: absolute;
        top: 8px;
        left: 8px;
        right: 8px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        z-index: 5;
        font-size: clamp(12px, 3vw, 16px);
        color: #eaeaea;
        text-shadow: 1px 1px 0 #0f0e17;
      }

      /* === Pause Button === */
      #pause-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 6;
        width: 40px;
        height: 40px;
        background: rgba(22, 33, 62, 0.8);
        border: 1px solid #e94560;
        color: #eaeaea;
        font-size: 18px;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        font-family: monospace;
      }

      #pause-btn:hover {
        background: #e94560;
      }

      /* === Responsive === */
      @media (max-width: 480px) {
        .btn {
          min-width: 160px;
          padding: 12px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <button id="pause-btn" aria-label="Pause">||</button>

      <!-- Menu Screen -->
      <div id="menu-screen" class="screen-overlay">
        <div class="screen-title">Maze Runner</div>
        <div class="screen-subtitle">Pixel Labyrinth</div>
        <button class="btn" id="btn-start">Start</button>
        <button class="btn" id="btn-continue" style="display:none">Continue</button>
        <button class="btn" id="btn-settings">Settings</button>
      </div>

      <!-- Settings Screen -->
      <div id="settings-screen" class="screen-overlay hidden">
        <div class="screen-title" style="font-size:clamp(18px,4vw,32px)">Settings</div>
        <div style="margin: 20px 0;">
          <div class="settings-row">
            <label>Sound</label>
            <button class="toggle-btn active" id="toggle-sound">ON</button>
          </div>
          <div class="settings-row">
            <label>Vibration</label>
            <button class="toggle-btn active" id="toggle-vibration">ON</button>
          </div>
          <div class="settings-row">
            <label>Show FPS</label>
            <button class="toggle-btn" id="toggle-debug">OFF</button>
          </div>
        </div>
        <button class="btn" id="btn-settings-back">Back</button>
      </div>

      <!-- Pause Screen -->
      <div id="pause-screen" class="screen-overlay hidden">
        <div class="screen-title" style="font-size:clamp(18px,4vw,32px)">Paused</div>
        <button class="btn" id="btn-resume">Resume</button>
        <button class="btn" id="btn-restart">Restart</button>
        <button class="btn" id="btn-pause-menu">Menu</button>
      </div>

      <!-- Results Screen -->
      <div id="results-screen" class="screen-overlay hidden">
        <div class="screen-title" style="font-size:clamp(18px,4vw,32px)">Level Complete!</div>
        <div class="result-stats">
          <div>Time: <span class="value" id="result-time">0.0s</span></div>
          <div>Wall hits: <span class="value" id="result-hits">0</span></div>
          <div>Best time: <span class="value" id="result-best">--</span></div>
        </div>
        <button class="btn" id="btn-next">Next Level</button>
        <button class="btn" id="btn-retry">Retry</button>
        <button class="btn" id="btn-results-menu">Menu</button>
      </div>

      <!-- Tutorial overlay (shown once) -->
      <div id="tutorial-screen" class="screen-overlay hidden">
        <div class="screen-title" style="font-size:clamp(16px,4vw,28px)">How to Play</div>
        <div style="text-align:center; max-width:300px; line-height:1.6; margin:16px 0; font-size:clamp(12px,3vw,16px);">
          <div style="color:#4cc9f0">PC: Move mouse / WASD / Arrows</div>
          <div style="color:#4cc9f0; margin-top:8px">Mobile: Touch & drag (joystick)</div>
          <div style="color:#f5d442; margin-top:16px">Reach the golden exit!</div>
        </div>
        <button class="btn" id="btn-tutorial-ok">Got it!</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
